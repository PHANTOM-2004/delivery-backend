syntax="proto3";

package user;

option go_package="/user";



//管理员服务
////////////////////////////////////////////////////////

service UserService{
    rpc Register(RegisterReq ) returns (RegisterResp) {}
    rpc Login(LoginReq) returns (LoginResp) {}
}

enum Role{
  ROLE_ADMIN = 0;
  ROLE_MERCH = 1;
  ROLE_WX = 2;
}

message LoginReq{
    string account = 1;
    string password = 2;
    Role role = 3;
}

message LoginResp{
    uint32 user_id = 1;
}

message RegisterReq{
    string name = 1;
    string password = 2;
    //可选
    string account = 3;
}

message RegisterResp{
    uint32 user_id = 1;
    string account = 2;
}
