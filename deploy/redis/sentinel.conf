port 26379
daemonize yes
pidfile "/var/run/sentinel_26379.pid"
logfile "26379.log"
dir "/home/scarlet/Projects/Go/delivery-corebackend"

sentinel monitor delivery-master 127.0.0.1 6380 1
# 设置主节点密码
sentinel auth-pass delivery-master your_password
# 多久判定节点失败（毫秒）
sentinel down-after-milliseconds delivery-master 5000
# 故障转移超时时间
sentinel failover-timeout delivery-master 60000
# 同时进行故障转移的节点数

# Generated by CONFIG REWRITE
latency-tracking-info-percentiles 50 99 99.9
protected-mode no
user default on nopass sanitize-payload ~* &* +@all
sentinel myid ff35f4ead4aed890c4b2ab5d7a1c5c0e6d60f1a5
sentinel config-epoch delivery-master 1
sentinel leader-epoch delivery-master 2
sentinel current-epoch 2

sentinel known-replica delivery-master 127.0.0.1 6379

